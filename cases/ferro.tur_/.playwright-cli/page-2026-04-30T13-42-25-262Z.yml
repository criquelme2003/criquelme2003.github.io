      - heading "No es una cafetería en un vagón. Es un vagón que sirve café." [level=2] [ref=e179]:
        - text: No es una cafetería en un vagón.
        - text: Es un vagón que sirve café.
      - generic [ref=e180]:
        - paragraph [ref=e181]: El coche que da vida a Ferro-Tur fue fabricado en Alemania en 1929 y llegó a Chile durante los años de mayor actividad ferroviaria en La Araucanía. Hoy forma parte del Museo Ferroviario de Carahue, restaurado tal como lo conocieron los pasajeros de época.
        - paragraph [ref=e182]:
          - text: Madera de alerce en las paredes, lámparas originales, tapizados de cuero rojo.
          - strong [ref=e183]: No hay otro lugar así en la región
          - text: ", y probablemente tampoco en el país."
        - paragraph [ref=e184]: "En invierno el espacio se siente especialmente propio: menos gente, más silencio, la luz cálida de las lámparas contrastando con el gris de afuera. Para los que lo descubren en esta época del año, no hay otro horario en que volver."
